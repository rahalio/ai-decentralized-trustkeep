openapi: 3.1.0
info:
  title: Decision logs schemas
  version: 0.1.0
  description: Cross-functional decision log attached to trust actions.
paths: {}
components:
  schemas:
    DecisionLogId:
      type: string
      pattern: '^dlg_[0-9A-HJKMNP-TV-Z]{26}$'
    DecisionCategory:
      type: string
      enum: [compliance, business, technology]
    DecisionLog:
      type: object
      required: [id, title, category, outcome, decidedAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/DecisionLogId'
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/DecisionCategory'
        outcome:
          type: string
          minLength: 1
          maxLength: 2000
        attendees:
          type: array
          items:
            type: string
        journeyId:
          $ref: ./journeys.schemas.yaml#/components/schemas/JourneyId
        linkedProposalId:
          $ref: ./monetization-gates.schemas.yaml#/components/schemas/MonetizationProposalId
        linkedIncidentId:
          $ref: ./breach-playbooks.schemas.yaml#/components/schemas/BreachIncidentId
        decidedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    DecisionLogCreate:
      type: object
      required: [title, category, outcome, decidedAt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/DecisionCategory'
        outcome:
          type: string
          minLength: 1
          maxLength: 2000
        attendees:
          type: array
          items:
            type: string
        journeyId:
          $ref: ./journeys.schemas.yaml#/components/schemas/JourneyId
        linkedProposalId:
          $ref: ./monetization-gates.schemas.yaml#/components/schemas/MonetizationProposalId
        linkedIncidentId:
          $ref: ./breach-playbooks.schemas.yaml#/components/schemas/BreachIncidentId
        decidedAt:
          type: string
          format: date-time
    DecisionLogListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DecisionLog'
        nextCursor:
          type: string
    DecisionLogResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DecisionLog'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    DecisionLogListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DecisionLogListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
